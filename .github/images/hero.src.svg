  <path d="M790 166 C796 192 818 206 861 211 M850 208 L861 211 M856 201 L861 211" fill="none" stroke="#ffd447" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="150" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="30" fill="#ffd447" stroke="#245f9f" stroke-width="7" stroke-linejoin="round" paint-order="stroke" transform="rotate(-4 820 150)">start with the hub</text>
