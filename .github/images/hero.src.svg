    <g font-size="14" font-weight="600" letter-spacing="1"><text x="858" y="465">479</text><text x="932" y="465">500+ VIEWS</text><text x="1068" y="465">APACHE 2</text><text x="836" y="492">2026-10-05</text><text x="932" y="492">ROBFROMBOULDER</text><text x="1068" y="492">CLAUDE</text></g>
